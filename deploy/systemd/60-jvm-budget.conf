[Service]
# Keep enough heap for a 2 MiB screenshot and release unused heap sooner after a burst.
Environment="JAVA_TOOL_OPTIONS=-Xms8m -Xmx56m -Xss512k -XX:+UseSerialGC -XX:ActiveProcessorCount=1 -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=12m -XX:MinHeapFreeRatio=5 -XX:MaxHeapFreeRatio=20 -XX:-ShrinkHeapInSteps"
# glibc gives every busy thread its own malloc arena (64 MiB reserved each); the HTTP client and virtual threads
# made several of them. Two arenas are plenty for one user (2026-11-27).
Environment="MALLOC_ARENA_MAX=2"
