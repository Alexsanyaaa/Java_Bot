[Unit]
Wants=mentor-memory-guard.timer

[Service]
ExecCondition=+/usr/local/sbin/mentor-memory-guard allow-start
Environment="JAVA_TOOL_OPTIONS=-Xms16m -Xmx80m -Xss512k -XX:+UseSerialGC -XX:ActiveProcessorCount=1 -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=24m"
MemoryAccounting=yes
MemoryHigh=150M
MemoryMax=192M
MemorySwapMax=0
OOMScoreAdjust=800
OOMPolicy=kill
TimeoutStopSec=8s
Restart=on-failure
RestartSec=300s
